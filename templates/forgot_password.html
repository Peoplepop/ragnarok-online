{% extends "base.html" %}
{% block title %}忘記密碼 - 五行爭鋒{% endblock %}

{% block content %}
  <div class="panel" style="max-width: 360px; margin: 0 auto;">
    <h2 style="margin-top:0; color: var(--gold-bright); font-size: 18px;">忘記密碼</h2>
    {% if state == 'pending' %}
    <p class="hint" style="margin-top:0;">申請已送出，正在等待管理員審核。審核通過後，重新整理這個頁面即可看到「重設密碼」按鈕。</p>
    <a href="{{ url_for('auth.forgot_password') }}" class="btn">🔄 重新整理查詢審核狀態</a>
    {% else %}
    <p class="hint" style="margin-top:0;">請輸入你的帳號，送出後請等待管理員審核；審核通過後回到這個頁面即可設定新密碼。</p>
    <form method="post" action="{{ url_for('auth.forgot_password') }}">
      <label for="username">帳號</label>
      <input type="text" id="username" name="username" required autofocus>
      <button type="submit">送出申請</button>
    </form>
    {% endif %}
    <p class="hint">想起密碼了？<a href="{{ url_for('auth.login') }}">前往登入</a></p>
  </div>
{% endblock %}
