{% extends "base.html" %}
{% block title %}註冊 - 五行爭鋒{% endblock %}

{% block content %}
  <div class="panel" style="max-width: 360px; margin: 0 auto;">
    <h2 style="margin-top:0; color: var(--gold-bright); font-size: 18px;">建立帳號</h2>
    {% if country %}
    <p class="hint" style="margin-top:-6px;">
      已選擇的國家：<strong style="color:var(--gold-bright);">{{ country.name }}</strong>（屬性：{{ country.element }}）
    </p>
    {% endif %}
    <form method="post" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="country_id" value="{{ country.id if country else '' }}">
      <label for="username">帳號</label>
      <input type="text" id="username" name="username" required minlength="3" autofocus>

      <label for="password">密碼</label>
      <div class="password-field">
        <input type="password" id="password" name="password" required minlength="8" maxlength="12" pattern="(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z]).+" title="8～12 個字元，需包含數字及大小寫英文字母">
        <button type="button" class="password-toggle" data-target="password" aria-label="按住顯示密碼">👁</button>
      </div>
      <p class="hint" style="margin:2px 0 14px; font-size:11px; color:#ffe066;">需同時包含數字及大小寫英文字</p>

      <label for="confirm">確認密碼</label>
      <div class="password-field">
        <input type="password" id="confirm" name="confirm" required minlength="8" maxlength="12">
        <button type="button" class="password-toggle" data-target="confirm" aria-label="按住顯示密碼">👁</button>
      </div>

      <label for="character_name">角色名稱（遊戲內顯示，不能跟帳號相同，最長 6 個字）</label>
      <input type="text" id="character_name" name="character_name" required minlength="2" maxlength="6">

      <button type="submit">註冊</button>
    </form>
    <p class="hint">已經有帳號了嗎？<a href="{{ url_for('auth.login') }}">前往登入</a></p>
  </div>
{% endblock %}
