{% extends "base.html" %}
{% block title %}註冊 - 五行爭鋒{% endblock %}

{% block content %}
  <div class="panel" style="max-width: 360px; margin: 0 auto;">
    <h2 style="margin-top:0; color: var(--gold-bright); font-size: 18px;">建立帳號</h2>
    <form method="post" action="{{ url_for('auth.register') }}">
      <label for="username">帳號</label>
      <input type="text" id="username" name="username" required minlength="3" autofocus>

      <label for="password">密碼</label>
      <input type="password" id="password" name="password" required minlength="8" maxlength="12" pattern="(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z]).+" title="8～12 個字元，需同時包含數字、大寫英文字母與小寫英文字母">
      <p class="hint" style="margin:4px 0 0;">8～12 個字元，需同時包含數字、大寫英文字母與小寫英文字母</p>

      <label for="confirm">確認密碼</label>
      <input type="password" id="confirm" name="confirm" required minlength="8" maxlength="12">

      <label for="character_name">角色名稱（遊戲內顯示，不能跟帳號相同）</label>
      <input type="text" id="character_name" name="character_name" required minlength="2" maxlength="20">

      <button type="submit">註冊</button>
    </form>
    <p class="hint">已經有帳號了嗎？<a href="{{ url_for('auth.login') }}">前往登入</a></p>
  </div>
{% endblock %}
