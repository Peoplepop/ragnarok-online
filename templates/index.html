{% extends "base.html" %}

{% block content %}
  <h1 style="font-size:26px;">諸神的黃昏</h1>
  <p class="subtitle">選擇你的國家，展開屬於你的冒險</p>

  {% if session.get('username') %}
    <div class="panel">
      <p>歡迎回來，<strong style="color: var(--gold-bright);">{{ session['username'] }}</strong>。</p>
      <p class="hint">角色創建功能即將推出。</p>
    </div>
  {% endif %}

  <div class="countries">
    {% for c in countries %}
    <div class="country">
      <div class="element">屬性：{{ c.element }}</div>
      <h3>{{ c.name }}</h3>
      <p>{{ c.description }}</p>
    </div>
    {% endfor %}
  </div>
{% endblock %}
