{% if current_tile.tile_type == 'fortress' %}
<div class="panel" style="flex:1 1 380px;">
  <h3 style="margin:0 0 12px; color:var(--gold-bright); font-size:15px;">🏛️ 國庫捐獻</h3>
  <div style="font-size:13px; color:var(--gold-bright); margin-bottom:8px;">
    🏛️ {{ character.name }}國庫：{{ own_treasury }} 諸神幣
  </div>
  <p class="hint" style="margin:0 0 8px;">捐獻金額須為 1000 的倍數</p>
  <p class="hint" style="margin:0 0 8px;">今日已捐 {{ donated_today_display }} / 上限 {{ donate_cap }} 諸神幣</p>
  <form method="post" action="{{ url_for('game.game_treasury_donate') }}" style="display:flex; gap:8px; align-items:center;">
    <input type="text" inputmode="numeric" name="amount" placeholder="1000的倍數" class="turn-action-control" style="width:120px;">
    <button type="submit" class="turn-action-control" style="padding:6px 14px; font-size:13px;">捐獻</button>
  </form>
</div>
{% endif %}
