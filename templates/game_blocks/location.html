<div class="panel" style="flex:1 1 380px;">
  <h3 style="margin:0 0 12px; color:var(--gold-bright); font-size:15px;">📍 你目前所在位置</h3>
  <div style="font-size:14px; color:var(--text); margin-bottom:4px;">你目前在「{{ current_tile.display_name }}」</div>

  <div style="margin-top:14px; padding:10px 12px; background:var(--panel-2); border-radius:6px;">
    {% if garrison %}
    <div style="font-size:13px; color:var(--gold-bright); margin-bottom:8px;">
      🛡️ 你目前駐防於「{{ garrison_tile.display_name if garrison_tile else "未知地點" }}」
    </div>
    <form method="post" action="{{ url_for('game.game_garrison_withdraw') }}">
      <button type="submit" class="turn-action-control" style="padding:6px 14px; font-size:13px;">撤離駐防</button>
    </form>
    {% elif can_station_here %}
    <div style="font-size:13px; color:var(--text-dim); margin-bottom:8px;">你目前沒有駐防，可以在此地（自己國家的要塞／城鎮）駐防守衛</div>
    <form method="post" action="{{ url_for('game.game_garrison_station') }}">
      <button type="submit" class="turn-action-control" style="padding:6px 14px; font-size:13px;">🛡️ 駐防此地</button>
    </form>
    {% else %}
    <div style="font-size:13px; color:var(--text-dim);">你目前沒有駐防</div>
    {% endif %}
  </div>
</div>
