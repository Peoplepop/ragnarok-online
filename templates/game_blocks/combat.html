<div class="panel" style="flex:1 1 380px;">
  <h3 style="margin:0 0 12px; color:var(--gold-bright); font-size:15px;">⚔️ 戰鬥</h3>

  <div style="font-size:13px; color:var(--text-dim); margin-bottom:8px;">前往打怪</div>
  {% if current_hp <= 0 %}
  <p class="hint" style="margin:0; color:var(--danger);">HP 已耗盡，無法戰鬥，請回到要塞選擇「回復」</p>
  {% elif current_tile.tile_type == 'fortress' %}
  <p class="hint" style="margin:0;">要塞內只有商店，沒有打怪地點，請先移動到要塞外</p>
  {% else %}
  <form method="post" action="{{ url_for('game.game_hunt') }}" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
    <select name="ground_id" class="turn-action-control">
      {% for g in hunting_grounds %}
      <option value="{{ g.id }}">{{ g.name }}（Lv.{{ g.min_level }}-{{ g.max_level }}）</option>
      {% endfor %}
    </select>
    <button type="submit" class="turn-action-control" style="padding:6px 14px; font-size:13px;">前往打怪</button>
  </form>
  {% if session.is_admin %}
  <form method="post" action="{{ url_for('game.game_hunt') }}" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px;">
    <select name="monster_id" class="turn-action-control">
      {% for m in admin_monsters %}
      <option value="{{ m.id }}">[{{ m.ground_name }}] {{ m.name }}（{{ m.level_label }}）</option>
      {% endfor %}
    </select>
    <button type="submit" class="turn-action-control" style="padding:6px 14px; font-size:13px;">🛠️ 指定怪物測試</button>
  </form>
  {% endif %}
  {% endif %}
</div>
