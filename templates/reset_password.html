{% extends "base.html" %}
{% block title %}設定新密碼 - 五行爭鋒{% endblock %}

{% block content %}
  <div class="panel" style="max-width: 360px; margin: 0 auto;">
    <h2 style="margin-top:0; color: var(--gold-bright); font-size: 18px;">設定新密碼</h2>
    <p class="hint" style="margin-top:0;">管理員已重設你的密碼，請先設定一組新密碼才能繼續遊戲。</p>
    <form method="post" action="{{ url_for('auth.reset_password') }}">
      <label for="password">新密碼</label>
      <div class="password-field">
        <input type="password" id="password" name="password" required minlength="8" maxlength="12" pattern="(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z]).+" title="8～12 個字元，需包含數字及大小寫英文字母" autofocus>
        <button type="button" class="password-toggle" data-target="password" aria-label="按住顯示密碼">👁</button>
      </div>

      <label for="confirm">確認新密碼</label>
      <div class="password-field">
        <input type="password" id="confirm" name="confirm" required minlength="8" maxlength="12">
        <button type="button" class="password-toggle" data-target="confirm" aria-label="按住顯示密碼">👁</button>
      </div>

      <button type="submit">設定新密碼</button>
    </form>
  </div>
{% endblock %}
